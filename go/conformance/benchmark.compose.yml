# Two ephemeral PostgreSQL 18 instances for co-scheduled A/B performance
# campaigns. Separate instances prevent candidate and baseline page-cache or
# checkpoint activity from contaminating each other; the runner removes both.
name: janusly-go-benchmark

services:
  candidate-postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:${JANUSLY_BENCH_CANDIDATE_PG_PORT:-4635}:5432"
    environment:
      POSTGRES_DB: janusly_go
      POSTGRES_USER: janusly
      POSTGRES_PASSWORD: janusly-go-benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janusly -d janusly_go"]
      interval: 2s
      timeout: 3s
      retries: 30

  baseline-postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:${JANUSLY_BENCH_BASELINE_PG_PORT:-4636}:5432"
    environment:
      POSTGRES_DB: janusly_go
      POSTGRES_USER: janusly
      POSTGRES_PASSWORD: janusly-go-benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janusly -d janusly_go"]
      interval: 2s
      timeout: 3s
      retries: 30
