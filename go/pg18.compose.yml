# Ephemeral PostgreSQL 18 revalidation lane. Its own project and port keep it
# isolated from the development database. No volume: `down -v` leaves nothing.
name: janusly-go-pg18

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:4634:5432"
    environment:
      POSTGRES_DB: janusly_go
      POSTGRES_USER: janusly
      POSTGRES_PASSWORD: janusly-go-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janusly -d janusly_go"]
      interval: 2s
      timeout: 3s
      retries: 30
