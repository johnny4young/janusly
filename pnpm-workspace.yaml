packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # Required by Vite/tsx; the exact version is constrained below.
  esbuild: true
  # Optional native acceleration used by BullMQ's msgpackr dependency.
  msgpackr-extract: true

# pnpm overrides. CI's `dep_audit` job (.github/workflows/ci.yml) runs
# `pnpm audit --audit-level moderate` on every push/PR, so any transitive
# that regresses to a vulnerable version fails CI — that audit is the
# backstop, and this block stays lean on purpose. The previous advisory
# overrides (fast-uri / hono / ws / qs / ip-address) were removed once the
# dependency tree caught up to patched versions on its own; the audit no
# longer flags them. Add an advisory override back only when CI flags a
# transitive the tree can't yet resolve itself, and name the advisory,
# parent chain, and removal condition. Advisories that can't be overridden
# at all (peer-dep-locked) are silenced in auditConfig.ignoreGhsas with a
# matching SECURITY.md section.
overrides:
  # GHSA-gv7w-rqvm-qjhr: esbuild <0.28.1 misses binary integrity verification.
  # Tooling-only transitive via tsx / drizzle-kit / vite; pin to the first patched
  # version until parents naturally carry it.
  esbuild: "0.28.1"

  # ioredis dedup (not an advisory). bullmq pins ioredis to an exact older
  # patch (5.10.1) while the app's direct deps track 5.11.0. Two physical
  # ioredis copies make a Redis instance from one line fail BullMQ's
  # `ConnectionOptions` type (type-identity mismatch in queue.ts/worker.ts).
  # Align everything to a single copy. Drop once bullmq's pin reaches it.
  ioredis: ">=5.11.0"

  # GHSA-frvp-7c67-39w9: @hono/node-server <2.0.5 allows path traversal in
  # `serve-static` on Windows via an encoded backslash (%5C). Transitive via
  # @modelcontextprotocol/sdk in packages/engine + packages/mcp-server; Janusly
  # never mounts that static handler, but the audit gate is severity-based, not
  # reachability-based. Drop once the MCP SDK depends on >=2.0.5 itself.
  "@hono/node-server": ">=2.0.5"
