groups:
  - name: janusly-runtime
    rules:
      - alert: JanuslyApiMetricsMissing
        expr: absent(up{job="janusly-api"}) or up{job="janusly-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Janusly API metrics are unavailable
          description: Alloy cannot scrape the API Prometheus endpoint for two minutes.

      - alert: JanuslyWorkerMetricsMissing
        expr: absent(up{job="janusly-worker"}) or up{job="janusly-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Janusly worker metrics are unavailable
          description: Alloy cannot scrape the worker Prometheus endpoint for two minutes.

      - alert: JanuslyWorkflowQueueWaiting
        expr: max(workflow_queue_waiting_jobs) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Customer workflow work has remained queued
          description: At least one workflow job has remained waiting for five minutes.

      - alert: JanuslyMaintenanceQueueWaiting
        expr: max(maintenance_queue_waiting_jobs) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Maintenance work has remained queued
          description: At least one maintenance job has remained waiting for ten minutes.

      - alert: JanuslyRateLimiterDegraded
        expr: max(janusly_rate_limit_degraded_buckets) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A Janusly rate limiter is failing open
          description: Traffic is still allowed, but at least one Redis-backed limiter is degraded.

      - alert: JanuslyNodeFailuresDetected
        expr: sum(increase(workflow_node_failures_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Workflow node failures were observed
          description: Janusly recorded one or more node failures during the last five minutes.
