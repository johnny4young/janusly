name: janusly-observability-cloud

services:
  alloy:
    image: grafana/alloy:v1.16.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?Set GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME:?Set GRAFANA_CLOUD_PROMETHEUS_USERNAME}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?Set GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:?Set GRAFANA_CLOUD_INSTANCE_ID}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN:?Set GRAFANA_CLOUD_API_TOKEN}
      JANUSLY_ENVIRONMENT: ${JANUSLY_ENVIRONMENT:-production}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./alloy/cloud.alloy:/etc/alloy/config.alloy:ro
      - alloy_cloud_data:/var/lib/alloy/data
    ports:
      - 127.0.0.1:12345:12345
      - 127.0.0.1:4318:4318
    restart: unless-stopped

volumes:
  alloy_cloud_data:
