name: janusly-local

x-app-environment: &app-environment
  DATABASE_URL: postgres://postgres:${JANUSLY_LOCAL_POSTGRES_PASSWORD:-janusly-local}@postgres:5432/workflow
  REDIS_URL: redis://redis:6379
  ALLOW_DEV_AUTH_HEADERS: "true"
  API_ALLOWED_ORIGINS: ${JANUSLY_LOCAL_WEB_ORIGINS:-http://localhost:7310,http://127.0.0.1:7310}
  JANUSLY_RESUME_TOKEN_SECRET: ${JANUSLY_LOCAL_RESUME_TOKEN_SECRET:-local-resume-token-secret-change-before-sharing}
  JANUSLY_LOCAL_STACK: "true"
  JANUSLY_LOCAL_ORG_ID: ${JANUSLY_LOCAL_ORG_ID:-default}
  JANUSLY_LOCAL_INTEGRATION_SIMULATOR: "true"
  JANUSLY_LOCAL_INTEGRATION_SIMULATOR_URL: http://provider-simulator:4010
  JANUSLY_LOCAL_GITHUB_TOKEN: local-github-token
  JANUSLY_LOCAL_SLACK_WEBHOOK_URL: http://provider-simulator:4010/slack/services/local/default
  JANUSLY_LOCAL_WEBHOOK_SECRET: local-webhook-secret
  JANUSLY_MAILER_PROVIDER: simulator
  JANUSLY_MAILER_FROM: ${JANUSLY_LOCAL_MAILER_FROM:-janusly@example.test}
  ALLOW_PRIVATE_HTTP_TARGETS: "true"
  JANUSLY_LLM_PROVIDER: anthropic
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_BASE_URL: http://ollama:11434
  JANUSLY_MEMORY_ENABLED: ${JANUSLY_MEMORY_ENABLED:-false}
  JANUSLY_EMBEDDING_PROVIDER: ${JANUSLY_EMBEDDING_PROVIDER:-ollama}
  JANUSLY_EMBEDDING_MODEL: ${JANUSLY_EMBEDDING_MODEL:-bge-m3}
  OTEL_EXPORTER: ${OTEL_EXPORTER:-console}

services:
  postgres:
    image: ${JANUSLY_POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JANUSLY_LOCAL_POSTGRES_PASSWORD:-janusly-local}
      POSTGRES_DB: workflow
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider-simulator:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.simulator
    image: janusly-local-provider-simulator
    restart: unless-stopped
    volumes:
      - provider_data:/data
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_SIMULATOR_PORT:-4010}:4010"

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
      target: api
    image: janusly-local-api
    restart: "no"
    environment: *app-environment
    command: ["pnpm", "--filter", "@janusly/db", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: janusly-local-api
    pull_policy: never
    restart: "no"
    environment: *app-environment
    command: ["pnpm", "--filter", "@janusly/api", "exec", "tsx", "../../scripts/seed-local-lab.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
      target: api
    image: janusly-local-api
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: "3001"
      OTEL_METRICS_HOST: 0.0.0.0
      OTEL_METRICS_PORT: "9464"
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_API_PORT:-7311}:3001"
      - "127.0.0.1:${JANUSLY_LOCAL_API_METRICS_PORT:-9464}:9464"
    depends_on:
      redis:
        condition: service_healthy
      provider-simulator:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
      target: worker
    image: janusly-local-worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      OTEL_METRICS_HOST: 0.0.0.0
      OTEL_METRICS_PORT: "9465"
      JANUSLY_WORKER_CONCURRENCY: ${JANUSLY_WORKER_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_WORKER_METRICS_PORT:-9465}:9465"
    depends_on:
      redis:
        condition: service_healthy
      provider-simulator:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${JANUSLY_LOCAL_API_URL:-http://localhost:7311}
        JANUSLY_BUILD_ID: ${JANUSLY_BUILD_ID:-local-docker}
    image: janusly-local-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_WEB_PORT:-7310}:3000"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    profiles: ["memory"]
    image: ollama/ollama:0.24.0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_EMBED_MODEL:-bge-m3}"
        wait $$pid
    environment:
      OLLAMA_EMBED_MODEL: bge-m3
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:${JANUSLY_LOCAL_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_EMBED_MODEL:-bge-m3}\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 600s

volumes:
  postgres_data:
  redis_data:
  provider_data:
  ollama_models:
