name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm bundle-check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(find cmd internal e2e -name '*.go' -type f))"
      - name: Build
        run: go build ./...
      - name: Generated contract and SQL
        run: |
          go tool sqlc generate
          go run ./cmd/contract
          git diff --exit-code -- schema.sql internal/store contract
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.7.2
          args: --timeout=10m
      - name: Reachable vulnerabilities
        run: go tool govulncheck ./...
      - name: Unit and race tests
        run: go test -race ./...

  integration:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: janusly
          POSTGRES_PASSWORD: janusly-local
          POSTGRES_DB: janusly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janusly -d janusly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JANUSLY_DATABASE_URL: postgres://janusly:janusly-local@127.0.0.1:5432/janusly?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - run: go run ./cmd/api migrate
      - run: go run ./cmd/api migrate
      - run: go test -race -tags integration -p 1 -count=1 ./...

  e2e:
    name: Single-runtime E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: bash scripts/test-e2e.sh

  artifact:
    name: Artifact
    runs-on: ubuntu-latest
    needs: [frontend, backend, integration, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: go run ./cmd/artifact
      - run: ./artifacts/janusly provenance
      - uses: actions/upload-artifact@v4
        with:
          name: janusly-${{ github.sha }}
          path: |
            artifacts/janusly
            artifacts/manifest.json
          if-no-files-found: error
          retention-days: 14
