name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm bundle-check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Format
        run: test -z "$(find cmd internal e2e -name '*.go' -type f -exec gofmt -l {} +)"
      - name: Build
        run: go build ./...
      - name: Local database port contract
        run: bash scripts/local-db-port.test.sh
      - name: Generated contract and SQL
        run: |
          go tool sqlc generate
          go run ./cmd/contract
          git diff --exit-code -- schema.sql internal/store contract
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v2.7.2
          args: --timeout=10m
      - name: Reachable vulnerabilities
        run: go tool govulncheck ./...
      - name: Unit and race tests
        run: go test -race ./...

  integration:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_USER: janusly
          POSTGRES_PASSWORD: janusly-local
          POSTGRES_DB: janusly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janusly -d janusly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JANUSLY_DATABASE_URL: postgres://janusly:janusly-local@127.0.0.1:5432/janusly?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - run: go run ./cmd/api migrate
      - run: go run ./cmd/api migrate
      - run: go test -race -tags integration -p 1 -count=1 ./...

  e2e:
    name: Single-runtime E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: bash scripts/test-e2e.sh

  artifact:
    name: Artifact
    runs-on: ubuntu-latest
    needs: [frontend, backend, integration, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: go run ./cmd/artifact
      - run: ./artifacts/janusly provenance
      - run: make supply-chain IMAGE=janusly:supply-chain-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janusly-${{ github.sha }}
          path: |
            artifacts/janusly
            artifacts/manifest.json
            artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 14
