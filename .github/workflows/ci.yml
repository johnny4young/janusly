name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel queued PR runs but never an in-flight push to main, so a fast
  # follow-up commit can't drop a green-on-main signal silently.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build_test:
    name: Build + jsdom test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated API contract
        run: pnpm contract:check

      - name: Build
        run: pnpm build

      - name: Test (jsdom)
        run: pnpm test

      - name: Test script utilities and deterministic recovery evals
        run: pnpm test:evals

  test_browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (browser mode)
        run: pnpm test:browser

      - name: Build production web bundle
        run: pnpm --filter @janusly/web build

      - name: Enforce bundle budgets
        run: pnpm bundle-check

      - name: Test route performance budgets
        env:
          JANUSLY_PERF_REPORT: artifacts/web-route-performance.json
        run: pnpm --filter @janusly/web test:performance

      - name: Upload web performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-performance
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  test_e2e:
    name: E2E (Compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (e2e — boots Compose, runs migrate, runs Playwright, brings Compose down)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  test_integration_pg18:
    name: Integration lanes on Postgres 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration lanes (real Postgres 18)
        run: pnpm test:integration

  # Go pilot lane — rides the SAME triggers as every other job (a private
  # repo bills per push, so the lane adds zero new pushes). No Compose in
  # the workflow YAML per the repo rule: the job talks to a plain service
  # container and runs the pilot's own make ci (sqlc + contract drift
  # guards, build, lint, unit + integration -race, semantic parity).
  test_go:
    name: Go pilot (make ci)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: janusly
          POSTGRES_PASSWORD: janusly-go-local
          POSTGRES_DB: janusly_go
        ports:
          - 4632:5432
        options: >-
          --health-cmd "pg_isready -U janusly -d janusly_go"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # The other PR jobs exercise GitHub's synthetic merge ref. The Go lane
      # additionally needs an artifact for the reviewed PR head itself, because
      # rollout evidence is bound to that immutable candidate commit and tree.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-only: true
      - name: Migrate (goose)
        working-directory: go
        run: go run ./cmd/api migrate
        env:
          JANUSLY_GO_DATABASE_URL: postgres://janusly:janusly-go-local@127.0.0.1:4632/janusly_go
      - name: make ci
        working-directory: go
        run: make ci
        env:
          JANUSLY_GO_DATABASE_URL: postgres://janusly:janusly-go-local@127.0.0.1:4632/janusly_go
      - name: Build exact deployable Go artifact
        working-directory: go
        run: make release-artifact
      - name: Upload exact Go artifact and manifest
        uses: actions/upload-artifact@v7
        with:
          name: janusly-go-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/go-release/native/
          if-no-files-found: error
          retention-days: 30

  dep_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit (fails on MODERATE+)
        run: pnpm audit --audit-level moderate

  test_sdk_python:
    name: SDK (Python) tests
    runs-on: ubuntu-latest
    # First Python package in the monorepo — runs alongside the Node lanes
    # in parallel but in its own job so a Python failure never blocks the
    # rest of CI from reporting status.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install (editable + dev deps)
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Test (pytest)
        working-directory: packages/sdk-python
        run: pytest -q

      - name: Type-check (mypy --strict)
        working-directory: packages/sdk-python
        run: mypy src/janusly
