name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel queued PR runs but never an in-flight push to main, so a fast
  # follow-up commit can't drop a green-on-main signal silently.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build_test:
    name: Build + jsdom test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        run: pnpm lint

      - name: Check generated API contract
        run: pnpm contract:check

      - name: Build
        run: pnpm build

      - name: Test (jsdom)
        run: pnpm test

      - name: Test script utilities
        run: pnpm test:scripts

  test_browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (browser mode)
        run: pnpm test:browser

      - name: Build production web bundle
        run: pnpm --filter @janusly/web build

      - name: Enforce bundle budgets
        run: pnpm bundle-check

      - name: Test route performance budgets
        env:
          JANUSLY_PERF_REPORT: artifacts/web-route-performance.json
        run: pnpm --filter @janusly/web test:performance

      - name: Upload web performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-performance
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  test_e2e:
    name: E2E (Compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (e2e — boots Compose, runs migrate, runs Playwright, brings Compose down)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  dep_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Version comes from the root package.json `packageManager` field —
      # single source of truth (action-setup v6 reads it when `version` is
      # omitted, and erroring on a dual spec is why we don't pass it here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit (fails on MODERATE+)
        run: pnpm audit --audit-level moderate

  test_sdk_python:
    name: SDK (Python) tests
    runs-on: ubuntu-latest
    # First Python package in the monorepo — runs alongside the Node lanes
    # in parallel but in its own job so a Python failure never blocks the
    # rest of CI from reporting status.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install (editable + dev deps)
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Test (pytest)
        working-directory: packages/sdk-python
        run: pytest -q

      - name: Type-check (mypy --strict)
        working-directory: packages/sdk-python
        run: mypy src/janusly
