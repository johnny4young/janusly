name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [develop, main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One diff decides which lanes a change needs: a web-only change skips the
  # Go and PostgreSQL lanes, a Go-only change skips the frontend lane, and
  # the single-runtime E2E runs for either. Shared inputs (workflows,
  # Makefile, scripts, deploy, the OpenAPI contract) run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.classify.outputs.web }}
      go: ${{ steps.classify.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            changed="everything"
          else
            changed=$(git diff --name-only "$base" "${{ github.sha }}")
          fi
          web=false; go=false
          if [ "$changed" = "everything" ]; then web=true; go=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(web/|contract/|internal/contract/)'; then web=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(cmd/|internal/|e2e/|go\.(mod|sum)$|schema\.sql$|sqlc\.yaml$|contract/)'; then go=true; fi
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/|Makefile$|scripts/|deploy/|docker-compose\.yml$|Dockerfile$)'; then web=true; go=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm bundle-check

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Format
        run: test -z "$(find cmd internal e2e -name '*.go' -type f -exec gofmt -l {} +)"
      - name: Build
        run: go build ./...
      - name: Local database port contract
        run: bash scripts/local-db-port.test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - name: Generated files leave no drift
        # Every `make generate` output, not just the Go ones: the pricing
        # table and the OpenAPI-derived TypeScript types are tracked files too.
        run: |
          go tool sqlc generate
          go run ./cmd/contract
          go run ./cmd/pricing
          (cd web && node scripts/generate-api-types.mjs)
          git diff --exit-code -- schema.sql internal/store contract web/src/lib/llm-pricing.generated.ts web/src/lib/api-types.generated.ts
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=10m
      - name: Reachable vulnerabilities
        run: go tool govulncheck ./...
      - name: Unit and race tests
        run: go test -race ./...

  integration:
    name: PostgreSQL 18 integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_USER: janusly
          POSTGRES_PASSWORD: janusly-local
          POSTGRES_DB: janusly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janusly -d janusly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JANUSLY_DATABASE_URL: postgres://janusly:janusly-local@127.0.0.1:5432/janusly?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - run: go run ./cmd/api migrate
      - run: go run ./cmd/api migrate
      - run: go test -race -tags integration -p 1 -count=1 ./...

  e2e:
    name: Single-runtime E2E
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium
      - run: bash scripts/test-e2e.sh

  artifact:
    name: Artifact
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, integration, e2e]
    # The image build is the expensive lane: only pushes to the integration
    # branches pay for it, and only when every lane that ran passed (skipped
    # lanes are not failures).
    if: >-
      !cancelled() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: go run ./cmd/artifact
      - run: ./artifacts/janusly provenance
      # `docker build --provenance --attest` needs a BuildKit builder on the
      # docker-container driver, and `--load` keeps those attestations only
      # when the daemon uses the containerd image store (Docker Desktop's
      # default; the runner's stock driver rejects attestations outright).
      - uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: make supply-chain IMAGE=janusly:supply-chain-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: janusly-${{ github.sha }}
          path: |
            artifacts/janusly
            artifacts/manifest.json
            artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 14
