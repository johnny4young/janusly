name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel queued PR runs but never an in-flight push to main, so a fast
  # follow-up commit can't drop a green-on-main signal silently.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build_test:
    name: Build + jsdom test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test (jsdom)
        run: pnpm test

  test_browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (browser mode)
        run: pnpm test:browser

  test_e2e:
    name: E2E (Compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # apps/web/package.json pins @playwright/test, so its hash flips only
          # when the Playwright version actually moves — unlike pnpm-lock.yaml,
          # which churns on every dep bump and would force needless re-downloads.
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium with system deps
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium

      - name: Test (e2e — boots Compose, runs migrate, runs Playwright, brings Compose down)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  dep_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit (fails on MODERATE+)
        run: pnpm audit --audit-level moderate

  test_sdk_python:
    name: SDK (Python) tests
    runs-on: ubuntu-latest
    # First Python package in the monorepo — runs alongside the Node lanes
    # in parallel but in its own job so a Python failure never blocks the
    # rest of CI from reporting status.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install (editable + dev deps)
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Test (pytest)
        working-directory: packages/sdk-python
        run: pytest -q
