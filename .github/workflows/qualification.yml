name: Qualification profiles

on:
  schedule:
    # Cheap drift probe only: no stack reset, browser run, or provider spend.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Exact qualification profile to execute
        required: true
        type: choice
        default: all_local
        options:
          - all_local
          - clean_install
          - identity
          - persistent_stack
          - security
          - tenant_isolation
          - upgrade_rollback
          - semantic_outcome
          - recovery_lab
          - load_soak
          - go_web
          - real_provider
          - supabase_pg18
      provider_budget_usd:
        description: Real-provider maximum budget in USD (used only by real_provider)
        required: false
        default: "0.50"
        type: string

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}-${{ inputs.profile || 'supabase-pg18' }}
  cancel-in-progress: false

jobs:
  supabase_pg18:
    name: Supabase PostgreSQL 18 drift probe
    if: github.event_name == 'schedule' || inputs.profile == 'supabase_pg18'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Detect when Supabase accepts PostgreSQL 18
        run: pnpm qualification:supabase-pg18

  qualification:
    name: Exact-head ${{ inputs.profile }} qualification
    if: github.event_name == 'workflow_dispatch' && inputs.profile != 'supabase_pg18'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium with system dependencies
        run: pnpm --filter @janusly/web exec playwright install --with-deps chromium
      - name: Run explicit qualification profile
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ inputs.profile == 'real_provider' && secrets.ANTHROPIC_API_KEY || '' }}
          JANUSLY_REAL_PROVIDER_BUDGET_USD: ${{ inputs.profile == 'real_provider' && inputs.provider_budget_usd || '' }}
        run: |
          args=(--profiles="${{ inputs.profile }}" --confirm-destructive)
          if [[ "${{ inputs.profile }}" == "real_provider" ]]; then
            args+=(--confirm-provider-cost)
          fi
          pnpm qualification:run -- "${args[@]}"
      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-${{ inputs.profile }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
