services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${JANUSLY_REDIS_HOST_PORT:-6379}:6379"

  postgres:
    # Parametrized so the CI compat job (and any self-host operator) can run
    # the SAME lifecycle against the oldest supported Postgres. Default stays
    # the dev/prod baseline.
    image: ${JANUSLY_POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${JANUSLY_POSTGRES_HOST_PORT:-5432}:5432"

  # Self-hosted embeddings model for the memory substrate (bge-m3, 1024-dim).
  # Dev brings this up automatically via scripts/run-dev.mjs. Production
  # operators who keep memory disabled can omit `ollama` from their
  # `docker compose up <services>` invocation. First boot pulls the bge-m3
  # model (~1.2 GB) into the named volume; subsequent boots reuse the cache.
  ollama:
    # Pinned (was :latest — unreproducible builds). 0.24.0 is the version the
    # dev fleet already runs; bump deliberately, not via silent pulls.
    image: ollama/ollama:0.24.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ollama serve &
        OLLAMA_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_EMBED_MODEL:-bge-m3}" || true
        wait $$OLLAMA_PID
    environment:
      OLLAMA_EMBED_MODEL: bge-m3
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # The healthcheck only flips `healthy` once the embed model is
    # actually pulled into the volume — `ollama list` alone returns 0
    # while the daemon is up but the model is still downloading, which
    # would mislead `docker compose ps` into showing `healthy` before
    # the service can answer an embedding call. The shell-form check
    # below greps for the configured model name so the signal is
    # honest. `start_period` is generous because the first-boot pull
    # of bge-m3 (~1.2 GB) can take several minutes on a slow
    # connection; subsequent boots reuse the cached weights and the
    # check passes within seconds.
    healthcheck:
      # `$${...}` keeps the variable un-interpolated by Compose at parse time
      # so it expands inside the container's shell against the running
      # service's env — matching the entrypoint's behaviour above. With
      # a single `$`, Compose would resolve from the HOST shell at parse
      # time (usually unset → literal "bge-m3"), so an operator running
      # a different embed model via env override would get a check that
      # greps for the wrong model and never flips healthy.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_EMBED_MODEL:-bge-m3}\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 600s

volumes:
  ollama_models:
