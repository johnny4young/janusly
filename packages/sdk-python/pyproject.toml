[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "janusly"
version = "0.0.1"
description = "Python SDK for the Janusly platform — typed client + stdlib-only HMAC webhook verifier."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Janusly" }]
keywords = ["janusly", "workflow", "sdk", "webhook", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.urls]
Homepage = "https://janus.ly"
Repository = "https://github.com/johnny4young/janusly"

[tool.hatch.build.targets.wheel]
packages = ["src/janusly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
]
